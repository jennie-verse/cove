<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <!--
      This document only ever runs inside an iframe with sandbox=
      "allow-scripts allow-popups allow-popups-to-escape-sandbox" and NO
      allow-same-origin token (see src/reader.js). That makes it cross-origin
      from the app shell, so script-src 'self' below can only ever load
      src/reader-frame.js — the one trusted bootstrap script cove ships here.
      Saved article bodies are sanitized (DOMPurify) by the app before they
      arrive via postMessage and are never themselves treated as script.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; img-src data:; style-src 'self'; connect-src 'none'; form-action 'none'; script-src 'self'"
    />
    <link rel="stylesheet" href="./src/reader-host.css" />
  </head>
  <body>
    <article id="content"></article>
    <script src="./src/reader-frame.js"></script>
  </body>
</html>
